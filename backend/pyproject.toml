[project]
name = "poseidon-backend"
version = "0.1.0"
description = "Poseidon ocean reconstruction backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "numpy>=1.26,<2.0",
  "xarray>=2024.9",
  "zarr>=2.18,<3.0",
  "netCDF4>=1.7",
  "pillow>=10.4",
  "scipy>=1.14",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "onnxruntime>=1.19",
  "lightgbm>=4.5",
  "pyyaml>=6.0",
  "copernicusmarine>=1.3",
  "cmocean>=4.0",
  "requests>=2.32",
  "earthaccess>=0.19.0",
  "h5py>=3.16.0",
]

[dependency-groups]
train = [
  "torch>=2.4",
  "onnx>=1.16",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.uv]
package = false
default-groups = ["dev", "train"]

[tool.uv.sources]
# CUDA 12.8 wheel on Windows (RTX 5070, sm_120 needs cu128); macOS/Linux fall through to the default PyPI wheel (mps/cpu)
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
